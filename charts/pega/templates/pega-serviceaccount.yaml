{{- $config := .Values.serviceAccount }}
{{- if .Values.global.serviceAccount.enabled }}
{{- $config = .Values.global.serviceAccount }}
{{- end }}
{{- if and $config.create (not $config.enabled) }}
{{- fail "serviceAccount.create requires serviceAccount.enabled=true" }}
{{- end }}
{{- if $config.enabled }}
{{- $name := include "pegaServiceAccountName" . }}
{{- include "validateServiceAccountName" (dict "name" $name "message" "serviceAccount.name") }}
{{- include "validateServiceAccountBoolean" (dict "value" $config.automountServiceAccountToken "message" "serviceAccount.automountServiceAccountToken") }}
{{- if $config.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
{{- with $config.labels }}
  labels:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- with $config.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
automountServiceAccountToken: {{ $config.automountServiceAccountToken }}
---
{{- end }}
{{- end }}
