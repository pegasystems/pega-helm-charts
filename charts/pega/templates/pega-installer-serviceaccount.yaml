{{- $config := .Values.installer.serviceAccount }}
{{- if and $config.create (not $config.enabled) }}
{{- fail "installer.serviceAccount.create requires installer.serviceAccount.enabled=true" }}
{{- end }}
{{- if $config.enabled }}
{{- $name := include "pegaInstallerServiceAccountName" (dict "root" . "config" $config) }}
{{- include "validateServiceAccountName" (dict "name" $name "message" "installer.serviceAccount.name") }}
{{- include "validateServiceAccountBoolean" (dict "value" $config.automountServiceAccountToken "message" "installer.serviceAccount.automountServiceAccountToken") }}
{{- if $config.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
{{- with $config.labels }}
  labels:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- with $config.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
automountServiceAccountToken: {{ $config.automountServiceAccountToken }}
---
{{- end }}
{{- end }}
