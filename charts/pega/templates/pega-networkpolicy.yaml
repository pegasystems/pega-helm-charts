{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $deployTiers := eq (include "networkPolicyDeployTiers" .) "true" }}
{{- $runInstaller := eq (include "networkPolicyRunInstaller" .) "true" }}
{{- $hazelcastEnabled := and $deployTiers .Values.hazelcast.enabled }}
{{- $clusteringServiceEnabled := and $deployTiers .Values.hazelcast.clusteringServiceEnabled }}
{{- $migrationJob := eq (include "networkPolicyMigrationJob" .) "true" }}
{{- $searchEnabled := and $deployTiers (eq (include "networkPolicyInternalSearch" .) "true") }}
{{- $constellationEnabled := eq ((.Values.constellation).enabled | toString) "true" }}
{{- $cassandraEnabled := eq (include "internalCassandraEnabled" . | trim) "true" }}
{{- $tiers := include "networkPolicyTierSelector" . }}
{{- $installer := include "networkPolicyInstallerSelector" . }}
{{- $hazelcast := include "networkPolicyHazelcastSelector" . }}
{{- $clusteringService := include "networkPolicyClusteringServiceSelector" . }}
{{- $search := include "networkPolicySearchSelector" . }}
{{- $constellation := include "networkPolicyConstellationSelector" . }}
{{- $cassandra := include "networkPolicyCassandraSelector" . }}
{{- $dnsRule := include "networkPolicyDnsRule" . }}
{{- $kubeApiRule := include "networkPolicyKubeApiRule" . }}

{{- if $np.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "default-deny") }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Keeps name resolution working for every workload in the namespace once default deny is active.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "dns") }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  {{- $dnsRule | nindent 2 }}
{{- end }}

{{- if $deployTiers }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "tiers") }}
spec:
  podSelector:
    {{- $tiers | nindent 4 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $tiers) "ports" (list 8080 8443 5701)) | nindent 2 }}
  {{- if $runInstaller }}
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $installer) "ports" (list 8080 8443)) | nindent 2 }}
  {{- end }}
  {{- if $constellationEnabled }}
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $constellation) "ports" (list 8080 8443)) | nindent 2 }}
  {{- end }}
  {{- with include "networkPolicyPeerIngressRule" (dict "peers" $np.ingress.from "ports" (list 8080 8443)) }}
  {{- . | nindent 2 }}
  {{- end }}
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- with $kubeApiRule }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $tiers "ports" (list 8080 8443 5701)) | nindent 2 }}
  {{- if $hazelcastEnabled }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $hazelcast "ports" (list 5701)) | nindent 2 }}
  {{- end }}
  {{- if $clusteringServiceEnabled }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $clusteringService "ports" (list 5701)) | nindent 2 }}
  {{- end }}
  {{- if $searchEnabled }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $search "ports" (list 9200)) | nindent 2 }}
  {{- end }}
  {{- if $cassandraEnabled }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $cassandra "ports" (list 9042)) | nindent 2 }}
  {{- end }}
  {{- if $constellationEnabled }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $constellation "ports" (list 3000)) | nindent 2 }}
  {{- end }}
  {{- include "networkPolicyDestinationRule" (dict "name" "networkPolicy.database" "config" $np.database "required" true) | nindent 2 }}
  {{- $required := dict "kafka" (.Values.stream).enabled "externalSearch" (not $searchEnabled) "externalCassandra" (and (.Values.dds).externalNodes true) }}
  {{- range $name := list "kafka" "externalSearch" "externalCassandra" }}
  {{- with include "networkPolicyDestinationRule" (dict "name" (printf "networkPolicy.%s" $name) "config" (get $np $name) "required" (get $required $name)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}

{{- if $runInstaller }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "installer") }}
spec:
  podSelector:
    {{- $installer | nindent 4 }}
  policyTypes:
  - Egress
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- with $kubeApiRule }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- include "networkPolicyDestinationRule" (dict "name" "networkPolicy.database" "config" $np.database "required" true) | nindent 2 }}
  {{- if $deployTiers }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $tiers "ports" (list 8080 8443)) | nindent 2 }}
  {{- end }}
  {{- if $cassandraEnabled }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $cassandra "ports" (list 9042)) | nindent 2 }}
  {{- end }}
{{- end }}

{{- if $constellationEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "constellation") }}
spec:
  podSelector:
    {{- $constellation | nindent 4 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $tiers) "ports" (list 3000)) | nindent 2 }}
  {{- with include "networkPolicyPeerIngressRule" (dict "peers" $np.ingress.from "ports" (list 3000)) }}
  {{- . | nindent 2 }}
  {{- end }}
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $tiers "ports" (list 8080 8443)) | nindent 2 }}
{{- end }}

{{- range $component := list (dict "enabled" $hazelcastEnabled "suffix" "hazelcast" "selector" $hazelcast) (dict "enabled" $clusteringServiceEnabled "suffix" "clusteringservice" "selector" $clusteringService) }}
{{- if $component.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" $ "suffix" $component.suffix) }}
spec:
  podSelector:
    {{- $component.selector | nindent 4 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $tiers $component.selector) "ports" (list 5701)) | nindent 2 }}
  {{- with include "networkPolicyPeerIngressRule" (dict "peers" $np.metrics.from "ports" (list 8089)) }}
  {{- . | nindent 2 }}
  {{- end }}
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $component.selector "ports" (list 5701)) | nindent 2 }}
{{- end }}
{{- end }}

{{- if $migrationJob }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "clusteringservice-migration") }}
spec:
  podSelector:
    {{- include "networkPolicyMigrationJobSelector" . | nindent 4 }}
  policyTypes:
  - Egress
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- $kubeApiRule | nindent 2 }}
{{- end }}

{{- if $searchEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "search") }}
spec:
  podSelector:
    {{- $search | nindent 4 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $tiers) "ports" (list 9200)) | nindent 2 }}
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $search) "ports" (list 9200 9300)) | nindent 2 }}
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $search "ports" (list 9200 9300)) | nindent 2 }}
{{- end }}

{{- if $cassandraEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "networkPolicyMetadata" (dict "root" . "suffix" "cassandra") }}
spec:
  podSelector:
    {{- $cassandra | nindent 4 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- $clients := list }}
  {{- if $deployTiers }}{{ $clients = append $clients $tiers }}{{ end }}
  {{- if $runInstaller }}{{ $clients = append $clients $installer }}{{ end }}
  {{- with $clients }}
  {{- include "networkPolicyPodIngressRule" (dict "selectors" . "ports" (list 9042)) | nindent 2 }}
  {{- end }}
  {{- include "networkPolicyPodIngressRule" (dict "selectors" (list $cassandra) "ports" (list 7000 7001 9042)) | nindent 2 }}
  egress:
  {{- $dnsRule | nindent 2 }}
  {{- include "networkPolicyPodEgressRule" (dict "selector" $cassandra "ports" (list 7000 7001 9042)) | nindent 2 }}
{{- end }}
{{- end }}
