{{- if .Values.networkPolicy.enabled }}
{{- $deploymentName := include "deploymentName" . }}
{{- $defaultDeny := true }}
{{- if hasKey .Values.networkPolicy "defaultDeny" }}
{{- $defaultDeny = .Values.networkPolicy.defaultDeny }}
{{- end }}
{{- if not (or (gt (len .Values.networkPolicy.ingress.cidrs) 0) .Values.networkPolicy.ingress.namespaceSelector .Values.networkPolicy.ingress.podSelector) }}
{{- fail "networkPolicy.ingress requires at least one of cidrs, namespaceSelector, or podSelector" }}
{{- end }}
{{- if not (and .Values.networkPolicy.dns.namespaceSelector .Values.networkPolicy.dns.podSelector) }}
{{- fail "networkPolicy.dns requires both namespaceSelector and podSelector" }}
{{- end }}
{{- if $defaultDeny }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "default-deny") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
{{- end }}
{{- if .Values.networkPolicy.externalSearch.enabled }}
{{- include "validateNetworkPolicyPorts" (dict "name" "networkPolicy.externalSearch" "ports" .Values.networkPolicy.externalSearch.ports) }}
{{- if not (or (gt (len .Values.networkPolicy.externalSearch.cidrs) 0) .Values.networkPolicy.externalSearch.namespaceSelector .Values.networkPolicy.externalSearch.podSelector) }}
{{- fail "networkPolicy.externalSearch requires at least one of cidrs, namespaceSelector, or podSelector" }}
{{- end }}
{{- if not (gt (len .Values.networkPolicy.externalSearch.ports) 0) }}
{{- fail "networkPolicy.externalSearch.ports must contain at least one destination port" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "external-search") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: Pega
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.externalSearch.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.externalSearch.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.externalSearch.namespaceSelector | nindent 8 }}
{{- if .Values.networkPolicy.externalSearch.podSelector }}
      podSelector:
{{ toYaml .Values.networkPolicy.externalSearch.podSelector | nindent 8 }}
{{- end }}
{{- else if .Values.networkPolicy.externalSearch.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.externalSearch.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.externalSearch.ports }}
    - protocol: TCP
      port: {{ . | int }}
{{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "dns") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 8 }}
      podSelector:
{{ toYaml .Values.networkPolicy.dns.podSelector | nindent 8 }}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "tiers") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: Pega
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: Pega
{{- range .Values.networkPolicy.ingress.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.ingress.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 8 }}
{{- if .Values.networkPolicy.ingress.podSelector }}
      podSelector:
{{ toYaml .Values.networkPolicy.ingress.podSelector | nindent 8 }}
{{- end }}
{{- else if .Values.networkPolicy.ingress.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.ingress.podSelector | nindent 8 }}
{{- end }}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - podSelector:
        matchLabels:
          component: Pega
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
{{- if .Values.hazelcast.enabled }}
  - to:
    - podSelector:
        matchLabels:
          app: pega-hazelcast
          component: Hazelcast
    ports:
    - protocol: TCP
      port: 5701
{{- end }}
{{- if .Values.hazelcast.clusteringServiceEnabled }}
  - to:
    - podSelector:
        matchLabels:
          app: clusteringservice
          component: Hazelcast
    ports:
    - protocol: TCP
      port: 5701
{{- end }}
{{- if and (not .Values.pegasearch.externalSearchService) (empty .Values.pegasearch.externalURL) }}
  - to:
    - podSelector:
        matchLabels:
          app: {{ include "searchName" . }}
          component: Search
    ports:
    - protocol: TCP
      port: 9200
{{- end }}
{{- if and .Values.cassandra.enabled (empty .Values.dds.externalNodes) }}
  - to:
    - podSelector:
        matchLabels:
          app: cassandra
          release: {{ .Release.Name }}
    ports:
    - protocol: TCP
      port: 9042
{{- end }}
---
{{- if .Values.hazelcast.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "hazelcast") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: pega-hazelcast
      component: Hazelcast
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: Pega
    - podSelector:
        matchLabels:
          app: pega-hazelcast
          component: Hazelcast
    ports:
    - protocol: TCP
      port: 5701
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: pega-hazelcast
          component: Hazelcast
    ports:
    - protocol: TCP
      port: 5701
---
{{- end }}
{{- if .Values.hazelcast.clusteringServiceEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "clusteringservice") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: clusteringservice
      component: Hazelcast
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: Pega
    - podSelector:
        matchLabels:
          app: clusteringservice
          component: Hazelcast
    ports:
    - protocol: TCP
      port: 5701
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: clusteringservice
          component: Hazelcast
    ports:
    - protocol: TCP
      port: 5701
---
{{- end }}
{{- if and (not .Values.pegasearch.externalSearchService) (empty .Values.pegasearch.externalURL) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "search") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "searchName" . }}
      component: Search
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: Pega
    - podSelector:
        matchLabels:
          app: {{ include "searchName" . }}
          component: Search
    ports:
    - protocol: TCP
      port: 9200
    - protocol: TCP
      port: 9300
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: {{ include "searchName" . }}
          component: Search
    ports:
    - protocol: TCP
      port: 9300
---
{{- end }}
{{- if and .Values.cassandra.enabled (empty .Values.dds.externalNodes) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "cassandra") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: cassandra
      release: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: Pega
    - podSelector:
        matchLabels:
          app: installer
    - podSelector:
        matchLabels:
          app: cassandra
          release: {{ .Release.Name }}
    ports:
    - protocol: TCP
      port: 9042
    - protocol: TCP
      port: 7000
    - protocol: TCP
      port: 7001
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: cassandra
          release: {{ .Release.Name }}
    ports:
    - protocol: TCP
      port: 9042
    - protocol: TCP
      port: 7000
    - protocol: TCP
      port: 7001
---
{{- end }}
{{- if and .Values.cassandra.enabled (empty .Values.dds.externalNodes) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "installer-cassandra") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: installer
  policyTypes:
  - Egress
  egress:
{{- if and .Values.cassandra.enabled (empty .Values.dds.externalNodes) }}
  - to:
    - podSelector:
        matchLabels:
          app: cassandra
          release: {{ .Release.Name }}
    ports:
    - protocol: TCP
      port: 9042
{{- end }}
---
{{- end }}
{{- end }}
