{{- if .Values.networkPolicy.enabled }}
{{- $deploymentName := include "deploymentName" . }}
{{- if .Values.networkPolicy.database.enabled }}
{{- include "validateNetworkPolicyPorts" (dict "name" "networkPolicy.database" "ports" .Values.networkPolicy.database.ports) }}
{{- if not (or (gt (len .Values.networkPolicy.database.cidrs) 0) .Values.networkPolicy.database.namespaceSelector .Values.networkPolicy.database.podSelector) }}
{{- fail "networkPolicy.database requires at least one of cidrs, namespaceSelector, or podSelector" }}
{{- end }}
{{- if not (gt (len .Values.networkPolicy.database.ports) 0) }}
{{- fail "networkPolicy.database.ports must contain at least one destination port" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "database") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: Pega
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.database.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.database.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.database.namespaceSelector | nindent 8 }}
{{- if .Values.networkPolicy.database.podSelector }}
      podSelector:
{{ toYaml .Values.networkPolicy.database.podSelector | nindent 8 }}
{{- end }}
{{- else if .Values.networkPolicy.database.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.database.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.database.ports }}
    - protocol: TCP
      port: {{ . | int }}
{{- end }}
---
{{- end }}
{{- if .Values.networkPolicy.kafka.enabled }}
{{- include "validateNetworkPolicyPorts" (dict "name" "networkPolicy.kafka" "ports" .Values.networkPolicy.kafka.ports) }}
{{- if not (or (gt (len .Values.networkPolicy.kafka.cidrs) 0) .Values.networkPolicy.kafka.namespaceSelector .Values.networkPolicy.kafka.podSelector) }}
{{- fail "networkPolicy.kafka requires at least one of cidrs, namespaceSelector, or podSelector" }}
{{- end }}
{{- if not (gt (len .Values.networkPolicy.kafka.ports) 0) }}
{{- fail "networkPolicy.kafka.ports must contain at least one destination port" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "kafka") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: Pega
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.kafka.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.kafka.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.kafka.namespaceSelector | nindent 8 }}
{{- if .Values.networkPolicy.kafka.podSelector }}
      podSelector:
{{ toYaml .Values.networkPolicy.kafka.podSelector | nindent 8 }}
{{- end }}
{{- else if .Values.networkPolicy.kafka.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.kafka.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.kafka.ports }}
    - protocol: TCP
      port: {{ . | int }}
{{- end }}
---
{{- end }}
{{- if .Values.networkPolicy.database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "networkPolicyName" (dict "deploymentName" $deploymentName "suffix" "installer-database") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: installer
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.database.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.database.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.database.namespaceSelector | nindent 8 }}
{{- if .Values.networkPolicy.database.podSelector }}
      podSelector:
{{ toYaml .Values.networkPolicy.database.podSelector | nindent 8 }}
{{- end }}
{{- else if .Values.networkPolicy.database.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.database.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.database.ports }}
    - protocol: TCP
      port: {{ . | int }}
{{- end }}
---
{{- end }}
{{- end }}
