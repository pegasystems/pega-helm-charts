{{- if .Values.networkPolicy.enabled }}
{{- $deploymentName := include "deploymentName" . }}
{{- if .Values.networkPolicy.database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-networkpolicy-database" $deploymentName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: Pega
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.database.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.database.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.database.namespaceSelector | nindent 8 }}
{{- end }}
{{- if .Values.networkPolicy.database.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.database.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.database.ports }}
    - protocol: TCP
      port: {{ . }}
{{- end }}
---
{{- end }}
{{- if .Values.networkPolicy.kafka.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-networkpolicy-kafka" $deploymentName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      component: Pega
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.kafka.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.kafka.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.kafka.namespaceSelector | nindent 8 }}
{{- end }}
{{- if .Values.networkPolicy.kafka.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.kafka.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.kafka.ports }}
    - protocol: TCP
      port: {{ . }}
{{- end }}
---
{{- end }}
{{- if .Values.networkPolicy.database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-networkpolicy-installer" $deploymentName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: installer
  policyTypes:
  - Egress
  egress:
  - to:
{{- range .Values.networkPolicy.database.cidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
{{- if .Values.networkPolicy.database.namespaceSelector }}
    - namespaceSelector:
{{ toYaml .Values.networkPolicy.database.namespaceSelector | nindent 8 }}
{{- end }}
{{- if .Values.networkPolicy.database.podSelector }}
    - podSelector:
{{ toYaml .Values.networkPolicy.database.podSelector | nindent 8 }}
{{- end }}
    ports:
{{- range .Values.networkPolicy.database.ports }}
    - protocol: TCP
      port: {{ . }}
{{- end }}
---
{{- end }}
{{- end }}
