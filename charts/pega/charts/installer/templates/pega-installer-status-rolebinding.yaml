{{ if (eq (include "createJobsReaderRole" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: check-installer-status
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "installerJobReaderRole" }}
subjects:
- kind: ServiceAccount
{{- $installerServiceAccount := .Values.serviceAccount }}
{{- $usesGlobalServiceAccount := false }}
{{- if and (not $installerServiceAccount.enabled) .Values.global.serviceAccount.enabled }}
{{- $installerServiceAccount = .Values.global.serviceAccount }}
{{- $usesGlobalServiceAccount = true }}
{{- end }}
  name: {{ if .Values.serviceAccountName }}{{ .Values.serviceAccountName }}{{ else if $installerServiceAccount.name }}{{ $installerServiceAccount.name }}{{ else }}{{ include "pegaInstallerServiceAccountName" (dict "root" . "config" $installerServiceAccount "useGlobal" $usesGlobalServiceAccount) }}{{ end }}
  namespace: {{ .Release.Namespace }}
{{ end }}