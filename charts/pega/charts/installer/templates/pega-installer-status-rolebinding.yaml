{{- if (eq (include "createJobsReaderRole" .) "true") }}
{{- /* Pods that run k8s-wait-for: Pega tiers and installer jobs. Pods without a configured ServiceAccount use "default". */ -}}
{{- $subjects := list }}
{{- range .Values.global.tier }}
{{- $name := include "pegaResolveServiceAccountName" (dict "override" (.custom).serviceAccountName "config" ($.Values.global.serviceAccount | default dict) "configPath" "global.serviceAccount" "generatedName" (include "pegaServiceAccountName" $)) }}
{{- $subjects = append $subjects ($name | default "default") }}
{{- end }}
{{- $installerName := include "pegaResolveServiceAccountName" (include "pegaInstallerServiceAccountArgs" . | fromJson) }}
{{- $subjects = append $subjects ($installerName | default "default") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: check-installer-status
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "installerJobReaderRole" }}
subjects:
{{- range $subjects | uniq }}
- kind: ServiceAccount
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
