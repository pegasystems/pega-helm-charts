{{- if (eq (include "createJobsReaderRole" .) "true") }}
{{- /* Pods that run k8s-wait-for: Pega tiers and installer jobs. Pods without a configured ServiceAccount use "default". */ -}}
{{- $subjects := list }}
{{- range .Values.global.tier }}
{{- $spec := include "pegaWorkloadServiceAccountSpec" (dict "root" $ "override" (.custom).serviceAccountName) | fromYaml }}
{{- $subjects = append $subjects ($spec.serviceAccountName | default "default") }}
{{- end }}
{{- $installerSpec := include "pegaInstallerServiceAccountSpec" . | fromYaml }}
{{- $subjects = append $subjects ($installerSpec.serviceAccountName | default "default") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: check-installer-status
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "installerJobReaderRole" }}
subjects:
{{- range $subjects | uniq }}
- kind: ServiceAccount
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
