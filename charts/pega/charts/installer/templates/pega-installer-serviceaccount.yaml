{{- $config := .Values.serviceAccount | default dict }}
{{- if and $config.create (not $config.enabled) }}
{{- fail "installer.serviceAccount.create requires installer.serviceAccount.enabled=true" }}
{{- end }}
{{- if and $config.enabled (not (or $config.name $config.create)) }}
{{- fail "installer.serviceAccount.enabled requires installer.serviceAccount.name or installer.serviceAccount.create=true" }}
{{- end }}
{{- if and (or (eq (include "performInstall" .) "true") (eq (include "performUpgrade" .) "true")) (not .Values.serviceAccountName) }}
{{- with include "pegaServiceAccountResource" (dict "config" $config "configPath" "installer.serviceAccount" "generatedName" (include "pegaInstallerServiceAccountDefaultName" .) "namespace" .Release.Namespace) }}
---
{{ . }}
{{- end }}
{{- end }}
