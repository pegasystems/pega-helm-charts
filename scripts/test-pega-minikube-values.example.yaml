# Base installation values are intentionally not included here.
# Supply a private values file with the Pega image, installer image, database
# connection, registry credentials, and any required license or secrets.
#
# Pass this file after the base installation values:
#   ./scripts/test-pega-minikube.sh \
#     --values /secure/pega-install-values.yaml \
#     --values scripts/test-pega-minikube-values.example.yaml

global:
  provider: k8s
  serviceAccount:
    enabled: true
    create: true
    name: pega-serviceaccount
    automountServiceAccountToken: false

networkPolicy:
  enabled: true
  defaultDeny: true
  database:
    enabled: true
    podSelector:
      matchLabels:
        cnpg.io/cluster: pega-postgres
    ports:
      - 5432
  kafka:
    enabled: true
    podSelector:
      matchLabels:
        strimzi.io/cluster: pega-kafka
    ports:
      - 9092
  customPolicies:
    - name: allow-custom-test-client-postgres-egress
      podSelector:
        matchLabels:
          network-test: custom-policy-client
      policyTypes:
        - Egress
      egress:
        - to:
            - podSelector:
                matchLabels:
                  cnpg.io/cluster: pega-postgres
          ports:
            - protocol: TCP
              port: 5432
    - name: allow-custom-test-client-postgres-ingress
      podSelector:
        matchLabels:
          cnpg.io/cluster: pega-postgres
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  network-test: custom-policy-client
          ports:
            - protocol: TCP
              port: 5432
    - name: allow-custom-test-client-external-https
      podSelector:
        matchLabels:
          network-test: custom-policy-client
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 1.1.1.1/32
          ports:
            - protocol: TCP
              port: 443
    - name: allow-custom-test-client-host-terminal
      podSelector:
        matchLabels:
          network-test: custom-policy-client
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 9999

installer:
  serviceAccount:
    enabled: true
    create: true
    name: pega-installer-serviceaccount
    automountServiceAccountToken: false
