---
# Minikube overlay for the NetworkPolicy templates.
# Use together with --reuse-values so the existing Pega configuration is kept.
networkPolicy:
  enabled: true
  defaultDeny: true
  database:
    enabled: true
    cidrs: []
    podSelector:
      matchLabels:
        cnpg.io/cluster: pega-postgres
    ports:
      - 5432
  kafka:
    enabled: true
    cidrs: []
    podSelector:
      matchLabels:
        strimzi.io/cluster: pega-kafka
    ports:
      - 9092
  customPolicies:
    # Minikube exposes the Kubernetes API through the node endpoint.
    - name: allow-kubernetes-api
      podSelector: {}
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 192.168.49.2/32
          ports:
            - protocol: TCP
              port: 8443
    # The JDBC driver is downloaded by the Pega runtime init container.
    - name: allow-pega-external-https
      podSelector:
        matchLabels:
          component: Pega
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 443
    # Installer jobs can download the distribution kit and JDBC driver.
    - name: allow-installer-external-https
      podSelector:
        matchLabels:
          app: installer
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 443
    # Kafka brokers and the entity operator need broker-to-broker and API access.
    - name: allow-kafka-cluster-egress
      podSelector:
        matchLabels:
          strimzi.io/cluster: pega-kafka
      policyTypes:
        - Egress
      egress:
        - to:
            - podSelector:
                matchLabels:
                  strimzi.io/cluster: pega-kafka
          ports:
            - protocol: TCP
              port: 9090
            - protocol: TCP
              port: 9091
            - protocol: TCP
              port: 9092
            - protocol: TCP
              port: 9093
        - to:
            - ipBlock:
                cidr: 192.168.49.2/32
          ports:
            - protocol: TCP
              port: 8443
    # CNPG uses the database pod for management and PostgreSQL traffic.
    - name: allow-postgres-ingress
      podSelector:
        matchLabels:
          cnpg.io/cluster: pega-postgres
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  component: Pega
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cnpg-system
          ports:
            - protocol: TCP
              port: 5432
            - protocol: TCP
              port: 8000
    - name: allow-postgres-egress
      podSelector:
        matchLabels:
          cnpg.io/cluster: pega-postgres
      policyTypes:
        - Egress
      egress:
        - to:
            - podSelector:
                matchLabels:
                  cnpg.io/cluster: pega-postgres
          ports:
            - protocol: TCP
              port: 5432
    # Test-only client policy. The diagnostic Pod must carry this exact label.
    - name: allow-custom-test-client-postgres-egress
      podSelector:
        matchLabels:
          network-test: custom-policy-client
      policyTypes:
        - Egress
      egress:
        - to:
            - podSelector:
                matchLabels:
                  cnpg.io/cluster: pega-postgres
          ports:
            - protocol: TCP
              port: 5432
    - name: allow-custom-test-client-postgres-ingress
      podSelector:
        matchLabels:
          cnpg.io/cluster: pega-postgres
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  network-test: custom-policy-client
          ports:
            - protocol: TCP
              port: 5432
    # Test-only external egress. NetworkPolicy cannot select DNS names, so use
    # a single documented test IP and port instead of allowing all internet traffic.
    - name: allow-custom-test-client-external-https
      podSelector:
        matchLabels:
          network-test: custom-policy-client
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 1.1.1.1/32
          ports:
            - protocol: TCP
              port: 443
    # Test-only connection to a listener on the Minikube host. Standard
    # NetworkPolicy cannot use the host.minikube.internal DNS name, so this
    # intentionally permits only TCP/9999 for the labeled diagnostic Pod.
    - name: allow-custom-test-client-host-terminal
      podSelector:
        matchLabels:
          network-test: custom-policy-client
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 9999

global:
  serviceAccount:
    enabled: true
    create: true
    name: "pega-serviceaccount"
    annotations: {}
    labels: {}
    automountServiceAccountToken: false

installer:
  serviceAccountName: ""
  serviceAccount:
    enabled: true
    create: true
    name: "pega-installer-serviceaccount"
    annotations: {}
    labels: {}
    automountServiceAccountToken: false
